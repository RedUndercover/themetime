name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/themetime-wails/frontend/package-lock.json

      - name: Validate and test
        run: make test

      - name: Vet Go packages
        run: go vet ./...

      - name: Build and verify release archive
        run: |
          make package COMMIT="${GITHUB_SHA::7}"
          (cd dist && sha256sum --check ./*.sha256)

      - name: Verify embedded version
        run: test "$(./bin/themetime version)" = "$(cat VERSION) (${GITHUB_SHA::7})"
