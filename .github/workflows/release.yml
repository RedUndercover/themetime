name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-x86-64:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cmd/themetime-wails/frontend/package-lock.json

      - name: Test and package
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          make test
          make package VERSION="${RELEASE_VERSION#v}" COMMIT="${GITHUB_SHA::7}"
          (cd dist && sha256sum --check ./*.sha256)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: themetime-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.sha256 \
              --verify-tag \
              --generate-notes \
              --title "ThemeTime $GITHUB_REF_NAME"
          fi
